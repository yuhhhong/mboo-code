plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.yu'
version = '0.0.1-SNAPSHOT'
description = 'mboo-code'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    implementation("com.alibaba.fastjson2:fastjson2:2.0.62")

    implementation 'dev.langchain4j:langchain4j-open-ai:1.19.0'
    implementation 'dev.langchain4j:langchain4j:1.19.0'
    implementation 'dev.langchain4j:langchain4j-reactor:1.19.0-beta29'
    implementation 'dev.langchain4j:langchain4j-mcp:1.19.0-beta29'
    implementation 'dev.langchain4j:langchain4j-skills:1.19.0-beta29'
    implementation 'org.apache.commons:commons-compress:1.28.0'

    implementation 'com.baomidou:mybatis-plus-spring-boot4-starter:3.5.16'
    implementation 'org.xerial:sqlite-jdbc:3.53.2.0'

    implementation("cn.hutool:hutool-all:5.8.46")
    implementation 'io.github.java-diff-utils:java-diff-utils:4.15'
    implementation 'org.apache.httpcomponents.client5:httpclient5'
    implementation 'org.jsoup:jsoup:1.21.1'
    implementation 'com.vladsch.flexmark:flexmark-html2md-converter:0.64.8'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
    }
}
